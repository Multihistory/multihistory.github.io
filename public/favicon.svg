<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Multihistory Science favicon</title>
  <desc id="desc">Graph[{DirectedEdge["Input", "Event 1"], DirectedEdge["Input", "Event 2"], DirectedEdge["Event 1", "Output"], DirectedEdge["Event 2", "Output"]}]</desc>
  <style>
    .edge { stroke: #aa5053; }
    .arrow { fill: #aa5053; }
    .token { fill: #edf0ff; stroke: #5369a4; }
    .event { fill: #f7a300; stroke: #9a5c12; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #ed8e87; }
      .arrow { fill: #ed8e87; }
      .token { fill: #b9c9fb; stroke: #d2dcff; }
      .event { fill: #ffb638; stroke: #ffcc72; }
    }
  </style>
  <path class="edge" d="M64 18 30 52 M64 18l34 34 M18 64l34 34 M110 64l-34 34"
    fill="none" stroke="#aa5053" stroke-width="5" stroke-linecap="round"/>
  <path class="arrow" d="M30 52l5-15 10 10z M98 52l-5-15-10 10z M52 98l-15-5 10-10z M76 98l15-5-10-10z" fill="#aa5053"/>
  <g class="token" fill="#edf0ff" stroke="#5369a4" stroke-width="3.3">
    <circle cx="64" cy="18" r="10.75"/><circle cx="64" cy="110" r="10.75"/>
  </g>
  <g class="event" fill="#f7a300" stroke="#9a5c12" stroke-width="3.3">
    <circle cx="18" cy="64" r="11.4"/><circle cx="110" cy="64" r="11.4"/>
  </g>
</svg>
